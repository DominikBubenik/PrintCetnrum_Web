<div class="container">
  <h2>User Profile</h2>
  <form>
    <div class="form-group">
      <label>First Name:</label>
      <input type="text" class="form-control" [(ngModel)]="user.firstName" name="firstName" placeholder="Enter first name" />
    </div>

    <div class="form-group">
      <label>Last Name:</label>
      <input type="text" class="form-control" [(ngModel)]="user.lastName" name="lastName" placeholder="Enter last name" />
    </div>

    <div class="form-group">
      <label>Email:</label>
      <input type="email" class="form-control" [(ngModel)]="user.email" name="email" placeholder="Enter email" />
    </div>

    <h3>Address</h3>

    <div class="form-group">
      <label>Street:</label>
      <input type="text" class="form-control" [(ngModel)]="user.street" name="street" placeholder="Enter street" />
    </div>

    <div class="form-group">
      <label>City:</label>
      <input type="text" class="form-control" [(ngModel)]="user.city" name="city" placeholder="Enter city" />
    </div>

    <div class="form-group">
      <label>Post:</label>
      <input type="text" class="form-control" [(ngModel)]="user.postcode" name="postcode" placeholder="Enter postcode" />
    </div>

    <button type="button" class="btn btn-primary" (click)="saveUser()">Save</button>
    <button type="button" class="btn btn-danger" (click)="openDeleteModal()">Deactivate</button>
  </form>

  <app-confirm-modal [title]="'Delete Account'"
                     [message]="'Are you sure you want to delete your account? This action cannot be undone.'"
                     [confirmButtonText]="'Delete'"
                     [isVisible]="showDeleteModal"
                     (confirmed)="deleteUser()"
                     (canceled)="closeDeleteModal()">
  </app-confirm-modal>
</div>
