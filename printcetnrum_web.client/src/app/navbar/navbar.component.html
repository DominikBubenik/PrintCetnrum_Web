<header>
  <div class="container">
    <div class="row">
      <div class="col-md-9 col-sm-9 col-9">
        <div class="menu-icon" (click)="openMenu()">
          <i class="{{menu_icon}}"></i>
        </div>
        <div class="desktop_menu" [class.mobile_menu]="menuValue" (click)="closeMenu()">
          <ul>
            <li [routerLink]="['/']" [class.active]="currentUrl === '/'" (click)="$event.stopPropagation()">Home</li>
            <li [routerLink]="['/upload']" [class.active]="currentUrl === '/upload'" (click)="$event.stopPropagation()">Upload Files</li>
            <li [routerLink]="['/userFiles']" [class.active]="currentUrl === '/userFiles'" (click)="$event.stopPropagation()">Your Files</li>
            <li *ngIf="isLoggedIn()" [routerLink]="['/allOrders']" [class.active]="currentUrl === '/allOrders'" (click)="$event.stopPropagation()">Your Orders</li>
            <li *ngIf="isLoggedIn() && isAdmin" [routerLink]="['/users']" [class.active]="currentUrl === '/users'" (click)="$event.stopPropagation()">Users</li>
            <li *ngIf="!isLoggedIn()" [routerLink]="['/login']" [class.active]="currentUrl === '/login'" (click)="$event.stopPropagation()">Log in</li>
            <li *ngIf="!isLoggedIn()" [routerLink]="['/register']" [class.active]="currentUrl === '/register'" (click)="$event.stopPropagation()">Register</li>
          </ul>
          <div *ngIf="isLoggedIn()" class="user-name-mobile"> Welcome, {{ userNameSignal() }}! </div>
        </div>
      </div>
      <div class="col-md-3 col-sm-3 col-3 text-end" *ngIf="isLoggedIn()">
        <div class="user-profile-dropdown">
          <div class="user-name" (click)="toggleDropdown($event)">
            {{ userNameSignal() }}
            <i class="bi bi-chevron-down ms-2"></i>
          </div>
          <div class="dropdown-menu" [class.show]="dropdownOpen">
            <button class="dropdown-user-btn" (click)="showUserProfile()">
              <i class="bi bi-person-circle"></i>
              <span>{{ userNameSignal() }}</span>
            </button>
            <div class="dropdown-divider"></div>
            <div class="dropdown-item" (click)="onLogout()">
              <i class="bi bi-box-arrow-right"></i>
              Logout
            </div>
          </div>
        </div>
      </div>
    </div>
  </div>
</header>
