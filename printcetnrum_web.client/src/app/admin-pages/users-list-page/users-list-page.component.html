<div class="row mt-10">
  <input type="text" placeholder="Search Username" id="findUsername" class="ms-3 col-md-4 form-control form-control w-auto" [(ngModel)]="searchedUsername" (ngModelChange)="findUser()"/>
  <h2 class="col-md-8 mb-4">User List</h2>
</div>
<table class="table table-striped table-bordered">
  <thead class="table-dark">
    <tr>
      <th scope="col" (click)="sortByUsername()">Username</th>
      <th scope="col" (click)="sortByName()">Name</th>
      <th scope="col" (click)="sortByEmail()">Email</th>
      <th scope="col" >Phone</th>
      <th scope="col" (click)="sortByRole()">Role</th>
      <th scope="col" (click)="sortByStreet()">Street</th>
      <th scope="col" (click)="sortByCity()">City</th>
      <th scope="col" (click)="sortByPostcode()">Postcode</th>
      <th scope="col">IsActive</th>
      <th scope="col">Actions</th>
    </tr>
  </thead>
  <tbody>
    <tr *ngFor="let user of filteredUsers">
      <td>{{ user.userName }}</td>
      <td>{{ user.firstName }} {{ user.lastName }}</td>
      <td>{{ user.email }}</td>
      <td>{{ user.phone }}</td>
      <td>{{ user.role }}</td>
      <td>{{ user.street }}</td>
      <td>{{ user.city }}</td>
      <td>{{ user.postcode }}</td>
      <td>{{ user.isActive }}</td>
      <td>
        <div class="d-flex">
          <button class="btn btn-primary me-2" (click)="onEdit(user)">
            <i class="bi bi-pencil"></i> Edit
          </button>
          <button class="btn me-2"
                  [ngClass]="user.isActive ? 'btn-danger' : 'btn-success'"
                  (click)="changeActivity(user.id, !user.isActive)">
            <i [ngClass]="user.isActive ? 'bi bi-trash' : 'bi bi-check-circle'"></i>
            {{ user.isActive ? 'Deactivate' : 'Activate' }}
          </button>
          <button class="btn btn-danger " (click)="onDelete(user.id)">
            <i class="bi bi-trash"></i> Delete
          </button>
        </div>
      </td>
    </tr>
  </tbody>
</table>
<button class="btn btn-secondary mt-3" (click)="onLogout()">Log out</button>
<div *ngIf="isModalVisible" class="modal fade show" id="editModal" tabindex="-1" aria-labelledby="editModalLabel" aria-hidden="true" style="display: block;">
  <div class="modal-dialog">
    <div class="modal-content">
      <div class="modal-header">
        <h5 class="modal-title" id="editModalLabel">Edit User</h5>
        <button type="button" class="btn-close" (click)="closeModal()"></button>
      </div>
      <div class="modal-body">
        <form *ngIf="currentUser" (ngSubmit)="onSave()">
          <div class="mb-3">
            <label for="firstName" class="form-label">First Name</label>
            <input type="text" class="form-control" id="firstName" [(ngModel)]="currentUser.firstName" name="firstName" required>
          </div>
          <div class="mb-3">
            <label for="lastName" class="form-label">Last Name</label>
            <input type="text" class="form-control" id="lastName" [(ngModel)]="currentUser.lastName" name="lastName" required>
          </div>
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" class="form-control" id="email" [(ngModel)]="currentUser.email" name="email" required>
          </div>
          <div class="mb-3">
            <label for="phone" class="form-label">Phone</label>
            <input type="text" class="form-control" id="phone" [(ngModel)]="currentUser.phone" name="phone" required>
          </div>
          <div class="mb-3">
            <label for="street" class="form-label">Street</label>
            <input type="text" class="form-control" id="street" [(ngModel)]="currentUser.street" name="street" required>
          </div>
          <div class="mb-3">
            <label for="city" class="form-label">City</label>
            <input type="text" class="form-control" id="city" [(ngModel)]="currentUser.city" name="city" required>
          </div> <div class="mb-3">
            <label for="postcode" class="form-label">Postcode</label>
            <input type="text" class="form-control" id="postcode" [(ngModel)]="currentUser.postcode" name="postcode" required>
          </div>
          <button type="submit" class="btn btn-primary">Save</button>
        </form>
      </div>
    </div>
  </div>
</div>
