<header></header>
<body (click)="deselectTextBox($event)" (keydown)="handleKeyDown($event)">
  <h1>Stamp Creator</h1>
  <label>Stamp Name:</label>
  <input type="text" [(ngModel)]="stampName" placeholder="Enter stamp name" />
  <div class="row">
    <label>Stamp Type</label>
    <select [(ngModel)]="stampType" class="form-select">
      <option value="modico2">MODICO 2</option>
      <option value="modico3">MODICO 3</option>
      <option value="modico4">MODICO 4</option>
      <option value="modico5">MODICO 5</option>
      <option value="other">Other</option>
    </select>
    <input *ngIf="stampType == 'other'" [(ngModel)]="stampDescription" placeholder="Enter short description and size"  maxlength="40"/>
  </div>
  <div class="controls-container" (click)="$event.stopPropagation()">
    <button class="add-text-btn" (click)="addTextBox()">Add Text</button>
    <button class="font-size-btn bi bi-arrow-left" (click)="undo()" [disabled]="history.length <= 1"></button>
    <input type="file" (change)="addImage($event)" accept="image/*" />
    <div class="font-size-controls">
      <button class="font-size-btn bi bi-dash" (click)="decreaseFontSize($event)"></button>
      <input type="number" class="font-size-input" [(ngModel)]="currentSize" (change)="setFontSize($event)" (click)="$event.stopPropagation()" />
      <button class="font-size-btn bi bi-plus" (click)="increaseFontSize($event)"></button>
    </div>
    <button class="font-size-btn bi bi-type-bold" (click)="toggleBold($event)"></button>
  </div>
  <div class="controls-container" (click)="$event.stopPropagation()">
    <button class="font-size-btn bi bi-download" (click)="downloadStamp()">Download Stamp</button>
    <button class="font-size-btn bi bi-download" (click)="saveStamp()">Save Stamp</button>
    <input class="font-size-btn bi bi-upload" type="file" (change)="loadStamp($event)" accept=".json" />
  </div>
  <div class="stamp-container" #stampContainer>
    <div *ngFor="let box of textBoxes; let i = index"
         class="text-box"
         [style.left.px]="box.x"
         [style.top.px]="box.y"
         [style.width.px]="box.width"
         [style.height.px]="box.height"
         [style.fontSize.px]="box.fontSize"
         [style.fontWeight]="box.isBold ? 'bold' : 'normal'"
         (mousedown)="startDrag($event, i)"
         (mousemove)="updateCursor($event, i)"
         (click)="selectTextBox($event, i)"
         contenteditable="true">
      <div *ngIf="!box.image" contenteditable="true">{{ box.text }}</div>
      <img *ngIf="box.image" [src]="box.image" [style.width.%]="100" [style.height.%]="100" />
      <span class="resize-handle" (mousedown)="startResize($event, i)"></span>
    </div>
  </div>
</body>
