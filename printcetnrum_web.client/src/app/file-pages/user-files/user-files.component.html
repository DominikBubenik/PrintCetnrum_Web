<header></header>
<body>
  <div class="main-container">
    <aside class="sidebar">
      <app-selected-files-list [selectedFiles]="markedFiles"></app-selected-files-list>
    </aside>
    <div class="content">
      <div class="file-actions-row">
        <button class="btn btn-primary" [routerLink]="['/upload']">Upload New File</button>
        <button class="btn btn-primary" [routerLink]="['/allOrders']">All Orders</button>
        <button class="btn btn-primary" [routerLink]="['/editStamp', -1]">New Stamp</button>
        <button class="btn btn-primary" [routerLink]="['/editDiploma', -1]">New Diploma</button>
      </div>
      <div class="sorting-options col-10">
        <select id="sortSelect" [(ngModel)]="criteria" (change)="sortFiles(criteria)" class="form-select me-3">
          <option value="date">Date</option>
          <option value="name">Name</option>
        </select>
        <div class="filter-options">
          <label class="filter-label">
            <input type="checkbox" [(ngModel)]="showImages" />
            <span>Show Images</span>
          </label>
          <label class="filter-label">
            <input type="checkbox" [(ngModel)]="showPDFFiles" />
            <span>Show PDF Files</span>
          </label>
          <label class="filter-label">
            <input type="checkbox" [(ngModel)]="showWordFiles" />
            <span>Show Word Files</span>
          </label>
          <label class="filter-label">
            <input type="checkbox" [(ngModel)]="showOtherFiles" />
            <span>Show Other Files</span>
          </label>
          <label class="filter-label">
            <input type="checkbox" [(ngModel)]="showStamps" />
            <span>Show Stamps</span>
          </label>
          <label class="filter-label">
            <input type="checkbox" [(ngModel)]="showDiplomas" />
            <span>Show Diplomas</span>
          </label>
        </div>
      </div>
      <div class="files-container">
        <app-file-card title="Other Files"
                       [files]="otherFiles"
                       [baseUrl]="baseUrl"
                       (markForPrint)="markForPrint($event)"
                       (editFile)="editFile($event)"
                       (openDeleteModal)="openDeleteModal($event, deleteModal)"
                       (toggleSelectFileCard)="toggleSelection($event)" *ngIf="showOtherFiles">
        </app-file-card>
        <app-file-card title="Images Files"
                       [files]="images"
                       [baseUrl]="baseUrl"
                       (markForPrint)="markForPrint($event)"
                       (editFile)="editFile($event)"
                       (openDeleteModal)="openDeleteModal($event, deleteModal)"
                       (toggleSelectFileCard)="toggleSelection($event)" *ngIf="showImages">
        </app-file-card>
        <app-file-card title="PDF Files"
                       [files]="pdfFiles"
                       [baseUrl]="baseUrl"
                       (markForPrint)="markForPrint($event)"
                       (editFile)="editFile($event)"
                       (openDeleteModal)="openDeleteModal($event, deleteModal)"
                       (toggleSelectFileCard)="toggleSelection($event)" *ngIf="showPDFFiles">
        </app-file-card>
        <app-file-card title="Word Files"
                       [files]="wordFiles"
                       [baseUrl]="baseUrl"
                       (markForPrint)="markForPrint($event)"
                       (editFile)="editFile($event)"
                       (openDeleteModal)="openDeleteModal($event, deleteModal)"
                       (toggleSelectFileCard)="toggleSelection($event)" *ngIf="showWordFiles">
        </app-file-card>
        <app-file-card title="Stamps"
                       [files]="stamps"
                       [baseUrl]="baseUrl"
                       (markForPrint)="markForPrint($event)"
                       (editFile)="editFile($event)"
                       (openDeleteModal)="openDeleteModal($event, deleteModal)" *ngIf="showStamps">
        </app-file-card>
        <app-file-card title="Diplomas"
                       [files]="diplomas"
                       [baseUrl]="baseUrl"
                       (markForPrint)="markForPrint($event)"
                       (editFile)="editFile($event)"
                       (openDeleteModal)="openDeleteModal($event, deleteModal)" *ngIf="showDiplomas">

        </app-file-card>
        </div>
        <ng-template #deleteModal let-modal>
          <div class="modal-header">
            <h5 class="modal-title">Confirm Deletion</h5>
            <button type="button" class="btn-close" (click)="modal.dismiss('Close click')"></button>
          </div>
          <div class="modal-body">
            <p>Are you sure you want to delete this file?</p>
          </div>
          <div class="modal-footer">
            <button type="button" class="btn btn-secondary" (click)="modal.dismiss('Close click')">Cancel</button>
            <button type="button" class="btn btn-danger" (click)="confirmDelete()">Delete</button>
          </div>
        </ng-template>
      </div>
    </div>
</body>
